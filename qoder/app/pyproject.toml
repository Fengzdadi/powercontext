[project]
name = "examradar"
version = "0.1.0"
description = "考前雷达 — 基于 seekdb 的课程知识检索系统"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pymysql>=1.1.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    "fastembed>=0.4.0",
    "pypdfium2>=4.30.0",
    "numpy>=1.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["examradar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring a running seekdb instance",
]
