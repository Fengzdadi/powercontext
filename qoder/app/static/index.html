<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>考前雷达</title>
<link rel="stylesheet" href="/static/css/style.css">
<script src="/static/js/source.js"></script>
</head>
<body>
<header>
<div class="container">
<h1>考前雷达</h1>
<nav>
<a href="/">首页</a>
<a href="/import.html">导入资料</a>
<a href="/ask.html">问笔记</a>
<a href="/radar.html">覆盖雷达</a>
<a href="/usage.html">使用记录</a>
</nav>
</div>
</header>
<div class="container">
<div class="card">
<h2>开始复习</h2>
<div class="form-row">
<div>
<label for="learner-name">你的名字</label>
<input type="text" id="learner-name" placeholder="例如：验收同学">
</div>
<div>
<label for="learner-course">课程 ID</label>
<input type="text" id="learner-course" value="db101">
</div>
</div>
<button class="btn" style="margin-top:12px" id="review-start-btn" onclick="startReview()">开始复习</button>
<div id="opening-line" style="margin-top:12px"></div>
<button class="btn" id="enter-coach-btn" style="display:none;margin-top:12px" onclick="enterCoach()">进入复习教练</button>
</div>
<div class="card">
<h2>系统状态</h2>
<div id="health">加载中...</div>
</div>
<div class="card">
<h2>快捷入口</h2>
<div class="quick-links">
<a href="/import.html">导入资料</a>
<a href="/ask.html">问笔记</a>
<a href="/radar.html">覆盖雷达</a>
<a href="/usage.html">使用记录</a>
<a href="/coach.html">复习教练</a>
<a href="/memory.html">我的记忆</a>
</div>
</div>
<div class="card">
<h2>已导入资料</h2>
<label for="course-select">课程 ID</label>
<input type="text" id="course-select" value="db101" style="max-width:200px">
<button class="btn" onclick="loadDocs()" style="margin-top:8px">刷新列表</button>
<div id="doc-list" style="margin-top:12px"></div>
</div>
</div>
<script>
async function checkHealth() {
  try {
    const r = await fetch('/api/health');
    const d = await r.json();
    const el = document.getElementById('health');
    const items = [
      ['seekdb', d.seekdb.ok],
      ['向量模型', d.embedding.ok, d.embedding.model],
      ['PowerContext', d.powercontext.ok, d.powercontext.detail],
    ];
    el.innerHTML = items.map(([name, ok, detail]) =>
      `<div style="padding:4px 0">${ok ? '✅' : '❌'} ${name}${detail ? ' — ' + detail : ''}</div>`
    ).join('');
  } catch(e) {
    document.getElementById('health').innerHTML = '<span style="color:red">无法连接服务</span>';
  }
}
async function loadDocs() {
  const cid = document.getElementById('course-select').value;
  try {
    const r = await fetch(`/api/documents?course_id=${encodeURIComponent(cid)}`);
    const docs = await r.json();
    const el = document.getElementById('doc-list');
    if (!docs.length) { el.innerHTML = '<p style="color:#888">暂无资料</p>'; return; }
    el.innerHTML = `<table><tr><th>文件名</th><th>类型</th><th>块数</th><th>导入时间</th></tr>` +
      docs.map(d => `<tr><td>${d.name}</td><td>${d.doc_kind}</td><td>${d.chunk_count}</td><td>${fmtLocalTime(d.created_at)}</td></tr>`).join('') +
      '</table>';
  } catch(e) {
    document.getElementById('doc-list').innerHTML = '<span style="color:red">加载失败</span>';
  }
}
function fmtLocalTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleString();
}

const SRC = new URLSearchParams(window.location.search).get('source') === 'auto' ? 'auto' : null;
const HDRS = Object.assign({'Content-Type': 'application/json'}, SRC ? {'X-ExamRadar-Source': SRC} : {});

function initReview() {
  const saved = localStorage.getItem('examradar_learner');
  if (saved) document.getElementById('learner-name').value = saved;
  const course = localStorage.getItem('examradar_course');
  if (course) document.getElementById('learner-course').value = course;
}

async function startReview() {
  const learner = document.getElementById('learner-name').value.trim();
  const course = document.getElementById('learner-course').value.trim();
  const el = document.getElementById('opening-line');
  if (!learner) { el.innerHTML = '<span style="color:#888">请先输入你的名字</span>'; return; }
  const btn = document.getElementById('review-start-btn');
  btn.disabled = true; btn.textContent = '开始中...';
  try {
    const r = await fetch('/api/sessions/start', {
      method: 'POST', headers: HDRS,
      body: JSON.stringify({learner, course_id: course})
    });
    const d = await r.json();
    if (!r.ok) { el.innerHTML = '<span style="color:red">' + (d.error || '开始失败') + '</span>'; return; }
    localStorage.setItem('examradar_learner', learner);
    localStorage.setItem('examradar_course', course);
    localStorage.setItem('examradar_session', d.session_id);
    el.innerHTML = (d.memory_ok ? '' : '<div style="color:#c88000">记忆服务暂不可用</div>') +
      (d.opening_line
        ? '<div class="status ok">' + escapeHtml(d.opening_line) + '</div>'
        : '<div class="status">这是你的第一次复习，还没有历史记忆。</div>');
    document.getElementById('enter-coach-btn').style.display = '';
  } catch (e) {
    el.innerHTML = '<span style="color:red">网络错误: ' + escapeHtml(e.message) + '</span>';
  }
  btn.disabled = false; btn.textContent = '开始复习';
}

function enterCoach() {
  window.location.href = '/coach.html' + (SRC ? '?source=auto' : '');
}

function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }

checkHealth();
loadDocs();
initReview();
</script>
</body>
</html>
