<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>问笔记 — 考前雷达</title>
<link rel="stylesheet" href="/static/css/style.css">
<script src="/static/js/source.js"></script>
</head>
<body>
<header>
<div class="container">
<h1>考前雷达</h1>
<nav>
<a href="/">首页</a>
<a href="/import.html">导入资料</a>
<a href="/ask.html">问笔记</a>
<a href="/radar.html">覆盖雷达</a>
<a href="/usage.html">使用记录</a>
</nav>
</div>
</header>
<div class="container">
<div class="card">
<h2>问笔记</h2>
<div class="form-row">
<div>
<label for="course-id">课程 ID</label>
<input type="text" id="course-id" value="db101">
</div>
<div style="flex:0 0 auto">
<label>&nbsp;</label>
<label style="display:flex;align-items:center;gap:6px;margin-top:16px">
<input type="checkbox" id="include-exam" style="width:auto"> 包含试卷
</label>
</div>
</div>
<label for="query-input">你的问题</label>
<textarea id="query-input" rows="2" placeholder="例如：B+树插入时结点怎么分裂？"></textarea>
<div id="llm-note" style="margin-top:6px;color:#888;font-size:0.9em"></div>
<button class="btn" style="margin-top:12px" id="search-btn" onclick="doSearch()">检索</button>
</div>
<div id="results-area"></div>
</div>
<!-- marked v15.0.12 (MIT), vendored from https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js -->
<script src="/static/lib/marked.min.js"></script>
<script>
const SHOW_FIRST = 5;
let llmConfigured = false;

function getSourceHeader() {
  return window.examRadarSource ? window.examRadarSource() : null;
}

async function checkLlm() {
  try {
    const r = await fetch('/api/coach/status');
    const d = await r.json();
    llmConfigured = !!(d.llm && d.llm.configured);
    if (llmConfigured) {
      const box = document.getElementById('llm-note');
      if (box) box.textContent = 'AI 回答已启用（' + (d.llm.model || 'LLM') + '）：检索后自动生成带 [n] 引用的回答';
    }
  } catch (e) { /* ignore */ }
}

function sourceLine(item) {
  const parts = [];
  if (item.document_name) parts.push(item.document_name);
  if (item.page) parts.push('第' + item.page + '页');
  if (item.question_no) parts.push('第' + item.question_no + '题' + (item.points ? ' (' + item.points + '分)' : ''));
  if (item.heading) parts.push(item.heading);
  return parts.join(' · ');
}

function fmtScore(v, digits) {
  return (v === null || v === undefined) ? '—' : Number(v).toFixed(digits);
}

function renderContent(text) {
  let html = marked.parse(escapeHtml(text || ''));
  // CommonMark leaves **…** literal when the closing delimiter follows
  // punctuation and precedes a CJK letter（"（redo）**来"）; fall back to
  // <strong> for leftover pairs outside code/pre
  if (html.includes('**')) {
    html = html.replace(
      /(<(?:code|pre)[\s\S]*?<\/(?:code|pre)>)|\*\*([^*\n]+?)\*\*/g,
      (m, code, inner) => code ? code : '<strong>' + inner + '</strong>');
  }
  return html;
}

function resultHtml(item) {
  return `<div class="result-item">
    <div class="meta">#${item.rank} ${escapeHtml(sourceLine(item))}</div>
    <div class="content md">${renderContent(item.content)}</div>
    <div class="scores">
      RRF: ${fmtScore(item.score, 4)} |
      关键词: ${fmtScore(item.keyword_score, 2)} (rank ${item.keyword_rank ?? '—'}) |
      语义: ${fmtScore(item.semantic_score, 4)} (rank ${item.semantic_rank ?? '—'})
    </div>
  </div>`;
}

async function doSearch() {
  const btn = document.getElementById('search-btn');
  const area = document.getElementById('results-area');
  btn.disabled = true;
  btn.textContent = '检索中...';
  area.innerHTML = '';
  const query = document.getElementById('query-input').value.trim();
  if (!query) { area.innerHTML = '<div class="card"><p>请输入问题</p></div>'; btn.disabled = false; btn.textContent = '检索'; return; }
  try {
    const r = await fetch('/api/search', {
      method: 'POST',
      headers: Object.assign({'Content-Type': 'application/json'}, getSourceHeader() ? {'X-ExamRadar-Source': getSourceHeader()} : {}),
      body: JSON.stringify({
        query: query,
        course_id: document.getElementById('course-id').value,
        include_exam: document.getElementById('include-exam').checked,
        top_k: 10,
        with_answer: llmConfigured,
      })
    });
    const d = await r.json();
    if (!d.results || !d.results.length) {
      area.innerHTML = '<div class="card"><p>没有找到相关结果</p></div>';
      return;
    }
    let html = '';
    if (d.llm_answer && d.llm_answer.answer) {
      html += '<div class="card"><h2>AI 回答</h2><div class="content md">' +
        marked.parse(escapeHtml(d.llm_answer.answer)) + '</div>' +
        '<div class="meta">引用编号对应下方检索结果</div></div>';
    } else if (d.llm_answer && d.llm_answer.error) {
      html += '<div class="card status warn">AI 回答生成失败：' + escapeHtml(d.llm_answer.error) + '</div>';
    }
    html += '<div class="card"><h2>检索结果</h2>';
    html += d.results.slice(0, SHOW_FIRST).map(resultHtml).join('');
    html += `<div id="more-results" style="display:none">` +
      d.results.slice(SHOW_FIRST).map(resultHtml).join('') + `</div>`;
    if (d.results.length > SHOW_FIRST) {
      html += `<button class="btn" style="width:100%" id="show-more-btn" onclick="showMore(this)">显示更多（${d.results.length - SHOW_FIRST} 条）</button>`;
    }
    html += '</div>';
    html += `<div class="card"><details><summary>seekdb 实际执行的检索 JSON</summary>
      <pre>${escapeHtml(JSON.stringify(d.search_json, null, 2))}</pre></details>
      <details><summary>GET_SQL 结果</summary><pre>${escapeHtml(d.actual_sql||'(空)')}</pre></details></div>`;
    area.innerHTML = html;
  } catch(err) {
    area.innerHTML = '<div class="card status err">检索失败: ' + escapeHtml(err.message) + '</div>';
  }
  btn.disabled = false;
  btn.textContent = '检索';
}

function showMore(btn) {
  document.getElementById('more-results').style.display = '';
  btn.remove();
}

function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
document.getElementById('query-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSearch(); }
});
checkLlm();
</script>
</body>
</html>
