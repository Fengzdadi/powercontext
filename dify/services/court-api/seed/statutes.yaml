# 《鸡毛蒜皮法典》—— 喵青天法庭适用的全部"法律"。
# 原创虚构内容，仅供娱乐。启动时写入 seekdb 的 statutes 表（全文 + 向量索引）。
- article_no: 1
  chapter: 第一编 总则
  title: 立法目的
  content: 为保障每一个人类、每一只猫以及每一件被人类迁怒的物品之鸡毛蒜皮权益，维护卧室、厨房、工位与沙发之和平，特制定本法典。
  tags: 总则 立法 和平
- article_no: 2
  chapter: 第一编 总则
  title: 适用范围
  content: 本法典适用于人类、猫、狗、家用电器、数码产品、食物、天气、身体部位、时间以及一切会让人生气的东西。被告不会说话的，由本庭代为发言。
  tags: 总则 被告 物品 电器 天气
- article_no: 3
  chapter: 第一编 总则
  title: 立案标准
  content: 凡事皆可诉。本庭立案以"事要小、气要大、判要好笑"为标准；涉及真实人身伤害、违法犯罪或重大财产纠纷者，请出门左转找真正的法院。
  tags: 总则 立案 标准
- article_no: 4
  chapter: 第一编 总则
  title: 法官回避
  content: 法官审理涉及猫粮、纸箱、激光笔、逗猫棒之案件时，原则上应当回避；本庭只有一位法官，故原则上不回避。
  tags: 总则 法官 回避 猫粮 纸箱
- article_no: 5
  chapter: 第二编 起居
  title: 睡眠神圣
  content: 法定睡眠时间为每日二十三时至次日九时，周末延长至十一时。任何物品不得在法定睡眠时间内制造超过猫咪呼噜声的噪音。
  tags: 睡眠 噪音 闹钟 吵醒 早起 周末
- article_no: 6
  chapter: 第二编 起居
  title: 闹钟授权
  content: 闹钟经主人设定而响铃者，责任由设定之人承担；贪睡按钮每按一次，原告的诉讼权利减弱一分。闹钟连续响铃超过五次者，视为主人默许其继续响。
  tags: 闹钟 起床 贪睡 响铃 授权
- article_no: 7
  chapter: 第二编 起居
  title: 被窝引力
  content: 冬季早晨被窝对人体产生之引力，视为不可抗力。因被窝引力导致迟到者，可减轻但不免除责任。
  tags: 被窝 冬天 起床 迟到 不可抗力
- article_no: 8
  chapter: 第二编 起居
  title: 楼上噪音
  content: 楼上住户深夜拖椅子、弹珠落地、跳绳及疑似在家打保龄球者，推定为扰民；楼上能证明自己家里没有弹珠的除外。
  tags: 邻居 楼上 噪音 弹珠 装修 深夜
- article_no: 9
  chapter: 第二编 起居
  title: 公共区域
  content: 合租房屋之客厅、厨房、卫生间为公共区域；在水槽里留下脏碗过夜者，视为对全体室友的挑衅，应洗碗一周以示悔改。
  tags: 室友 合租 洗碗 厨房 卫生间 公共区域
- article_no: 10
  chapter: 第三编 饮食
  title: 冰箱共有物
  content: 冰箱内未署名之食物视为共有物；已署名之食物，他人擅自食用者，应以等值或更高级之甜点赔偿，并当面道歉。
  tags: 冰箱 偷吃 室友 布丁 甜点 署名
- article_no: 11
  chapter: 第三编 饮食
  title: 最后一块
  content: 共享食物之最后一块，任何人取食前须大声询问"还有人要吗"并等待不少于三秒。未询问即取食者，构成"最后一块侵占"。
  tags: 最后一块 分享 零食 披萨 薯片
- article_no: 12
  chapter: 第三编 饮食
  title: 外卖时机
  content: 外卖应避免在收件人如厕、洗澡或刚躺下时送达；确实无法避免的，骑手应耐心等待不少于两分钟，收件人应说三声谢谢。
  tags: 外卖 骑手 厕所 洗澡 送达 时机
- article_no: 13
  chapter: 第三编 饮食
  title: 名不副实
  content: 食品包装上的图片仅供参考，但实物与图片差距超过三倍者，商家应承担"想象力赔偿"。薯片袋内空气超过一半者，空气部分视为赠品。
  tags: 薯片 包装 空气 泡面 图片 零食
- article_no: 14
  chapter: 第三编 饮食
  title: 香菜自由
  content: 每个人都享有加香菜与不加香菜的自由；在他人碗中擅自放香菜者，须亲手挑出，挑到最后一片为止。
  tags: 香菜 口味 饭菜 自由
- article_no: 15
  chapter: 第四编 宠物与动物
  title: 猫的特权
  content: 猫在任何时间踩人脸、推落桌上物品、占据键盘，均不构成侵权；但须于事后提供不少于十秒的呼噜作为补偿。
  tags: 猫 踩脸 推杯子 键盘 宠物 半夜
- article_no: 16
  chapter: 第四编 宠物与动物
  title: 狗的热情
  content: 狗因过度热情而扑人、拆家、把拖鞋叼走者，以"太高兴了"论，可免于处罚，但须陪原告散步一次作为社区服务。
  tags: 狗 拆家 拖鞋 热情 散步 宠物
- article_no: 17
  chapter: 第四编 宠物与动物
  title: 蚊子条款
  content: 夜间在人耳边盘旋之蚊子，一律推定为恶意；蚊子不得以"只是路过"作为抗辩理由。
  tags: 蚊子 夏天 半夜 耳边 嗡嗡
- article_no: 18
  chapter: 第五编 数码
  title: 联网义务
  content: 路由器及 WiFi 负有在关键时刻保持连接之义务；在游戏团战、视频会议、抢票、提交作业等关键时刻断线者，推定为故意。
  tags: WiFi 路由器 断网 网络 游戏 会议 抢票
- article_no: 19
  chapter: 第五编 数码
  title: 电量诚信
  content: 手机显示电量尚有百分之二十即突然关机者，构成电量欺诈；充电线只在特定角度才能充电者，构成选择性服务。
  tags: 手机 电量 关机 充电线 数码
- article_no: 20
  chapter: 第五编 数码
  title: 自动更新
  content: 任何软件不得在用户赶时间、开会或演示时擅自更新；确需更新的，应先征得同意，并如实告知"预计还需三分钟"的真实含义。
  tags: 自动更新 电脑 软件 开会 演示 重启
- article_no: 21
  chapter: 第五编 数码
  title: 输入法责任
  content: 输入法擅自联想并导致用户发出尴尬消息者，应承担连带责任；用户发送前未检查者，承担主要责任。
  tags: 输入法 打错字 联想 尴尬 消息 群聊
- article_no: 22
  chapter: 第五编 数码
  title: 回复义务
  content: 已读之消息应在合理时间内回复；仅回复"嗯""哦""好的"者，视为未回复。群聊中@全体成员而无人应答的，全体成员连带承担尴尬。
  tags: 已读不回 消息 回复 微信 群聊 朋友
- article_no: 23
  chapter: 第六编 身体与时间
  title: 体重秤免责
  content: 体重秤如实报告体重不构成诽谤；但节假日后三日内，体重秤可依原告申请保持沉默。
  tags: 体重秤 体重 减肥 胖 节假日
- article_no: 24
  chapter: 第六编 身体与时间
  title: 周一条款
  content: 周一已承受全人类足够的怨恨，原则上不得再被起诉；坚持起诉周一的，本庭只能判周一"深刻反省"。
  tags: 周一 上班 星期一 时间
- article_no: 25
  chapter: 第六编 身体与时间
  title: 截止日期
  content: 截止日期不得以"突然"为由到来；但原告此前明确说过"还早呢"的，视为放弃抗辩。
  tags: 截止日期 deadline 作业 拖延 加班
- article_no: 26
  chapter: 第六编 身体与时间
  title: 下班神圣
  content: 下班后及周末，任何人不得以"这个不急"为由派发工作；确需派发的，应附带奶茶一杯，并承诺周一之前不再追问。
  tags: 下班 加班 老板 派活 周末 工作
- article_no: 27
  chapter: 第六编 身体与时间
  title: 亲情豁免
  content: 家人基于关心而实施的唠叨、催婚、劝穿秋裤、劝多吃一碗饭等行为，适用亲情豁免；本庭只能调解，不能判家人败诉。
  tags: 家人 妈妈 老妈 唠叨 催婚 秋裤 亲情
- article_no: 28
  chapter: 第六编 身体与时间
  title: 头发保护
  content: 头发自行离开头皮者，不构成背叛；但在原告最需要发量的场合集中离开者，可以从轻谴责。
  tags: 头发 掉发 脱发 发型 理发
- article_no: 29
  chapter: 第七编 法庭秩序
  title: 禁止贿赂
  content: 任何人不得以猫条、小鱼干、冻干、纸箱或逗猫棒贿赂法官。违者物品没收（由法官当庭处理），行为记入案底。
  tags: 贿赂 猫条 小鱼干 冻干 法官 案底
- article_no: 30
  chapter: 第七编 法庭秩序
  title: 藐视法庭
  content: 在法庭上辱骂法官、学猫叫干扰庭审、或用激光笔晃法官眼睛者，构成藐视法庭，记入案底，下次到庭时从重审视。
  tags: 藐视法庭 辱骂 激光笔 捣乱 案底
- article_no: 31
  chapter: 第七编 法庭秩序
  title: 撤诉
  content: 原告可随时撤诉，但须对被告说一句"对不起，是我太激动了"。
  tags: 撤诉 道歉 和解
- article_no: 32
  chapter: 第七编 法庭秩序
  title: 判例效力
  content: 本庭判决一经作出，即编入《鸡毛蒜皮判例集》，供后来者援引；同类案件应参照既有判例裁判，判错了也要错得有趣。
  tags: 判例 判例集 援引 先例
- article_no: 33
  chapter: 第七编 法庭秩序
  title: 判决执行
  content: 被判决承担义务的一方，应在下次到庭时向本庭汇报执行情况；本庭记性很好，尤其记得没执行的。
  tags: 执行 汇报 下次 记性 案底
