- case_no: （2022）喵民初字第0047号
  plaintiff: 小郑
  defendant: 理发师
  defendant_type: person
  title: 小郑诉理发师"稍微修一下"剪成寸头案
  grievance: 小郑反复强调"稍微修一下就行"，理发师点头说好，二十分钟后小郑看到了镜子里的寸头。
  demand: 要求理发师把头发接回去。
  verdict: 一、"稍微"一词缺乏法定标准，理发师承担主要责任；二、理发师今后须用尺子确认"稍微"的长度；三、头发会长回来，本庭判原告三个月后再来复诊。
  outcome: split
  judge_quote: 理发师的"稍微"，和你的"稍微"，不在同一个宇宙喵。
