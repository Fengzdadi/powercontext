- case_no: （2019）喵民初字第0001号
  plaintiff: 早起困难户小林
  defendant: 公鸡
  defendant_type: pet
  title: 小林诉公鸡凌晨四点打鸣扰民案
  grievance: 隔壁的公鸡每天凌晨四点准时打鸣，比闹钟还早三个小时，小林已经连续一周没睡过整觉。
  demand: 要求公鸡改到早上九点再打鸣。
  verdict: 一、公鸡打鸣时间调整为早上六点半，周末顺延至八点；二、原告每周赠送公鸡一把小米，以弥补其作息调整损失。
  outcome: split
  judge_quote: 打鸣是公鸡的天职，睡觉是人类的天职，天职撞车，各退一步喵。
  tags: 打鸣 公鸡 早起 吵醒 噪音 睡眠
- case_no: （2019）喵民初字第0003号
  plaintiff: 大刘
  defendant: 闹钟
  defendant_type: appliance
  title: 大刘诉闹钟周末照常响铃案
  grievance: 周六早上七点闹钟照常大响，把好不容易的周末懒觉炸没了。大刘认为闹钟毫无人性。
  demand: 要求闹钟赔偿一个完整的周末早晨。
  verdict: 一、经查闹钟设置为"每天"，系原告本人设定，依《法典》第六条，责任在设定之人，闹钟无罪；二、原告当庭罚抄"周末"二字十遍。
  outcome: defendant
  judge_quote: 闹钟只是忠实地执行了你的命令，真正吵醒你的，是过去的你自己喵。
  tags: 闹钟 周末 懒觉 吵醒 起床 设置
- case_no: （2019）喵民初字第0005号
  plaintiff: 阿珍
  defendant: 室友
  defendant_type: person
  title: 阿珍诉室友偷吃署名布丁案
  grievance: 阿珍在布丁盖子上写了自己的名字，第二天冰箱里只剩一个空盒子，还被整齐地放回了原位。
  demand: 要求室友赔偿布丁并公开道歉。
  verdict: 一、依《法典》第十条，署名食物受保护，室友赔偿同款布丁两个；二、室友当面道歉，且道歉时不得舔嘴唇。
  outcome: plaintiff
  judge_quote: 把空盒子放回原位，是对布丁的二次伤害喵。
  tags: 布丁 偷吃 冰箱 室友 甜点 署名 零食
- case_no: （2019）喵民初字第0008号
  plaintiff: 王先生
  defendant: 自家的猫
  defendant_type: pet
  title: 王先生诉猫半夜三点踩脸案
  grievance: 猫每天凌晨三点准时踩王先生的脸，一脚踩在鼻子上，一脚踩在眼睛上，目的是要求开饭。
  demand: 要求猫改为踩被子。
  verdict: 一、依《法典》第十五条，猫踩脸不构成侵权；二、猫须在每次踩脸后提供不少于十秒的呼噜作为补偿；三、建议原告睡前把猫粮倒满。
  outcome: split
  judge_quote: 本庭也是猫，本庭理解被告的饥饿，但本庭判得很公正喵。
  tags: 猫 踩脸 半夜 开饭 宠物 睡觉
- case_no: （2020）喵民初字第0011号
  plaintiff: 小周
  defendant: 家里的 WiFi
  defendant_type: digital
  title: 小周诉 WiFi 团战关键时刻断线案
  grievance: 每次游戏打到团战关键时刻，WiFi 都会准时断线，平时刷视频却一点不卡，小周认为这是针对。
  demand: 要求 WiFi 公开道歉并赔偿一颗五星。
  verdict: 一、依《法典》第十八条，关键时刻断线推定为故意，WiFi 败诉；二、路由器即日起搬出柜子，站在客厅中央反省；三、原告每周重启路由器一次以示宽恕。
  outcome: plaintiff
  judge_quote: 平时不卡，关键时刻卡，这不是网络问题，这是人品问题喵。
  tags: WiFi 路由器 断网 游戏 团战 网络 卡顿
- case_no: （2020）喵民初字第0013号
  plaintiff: 李阿姨
  defendant: 楼上邻居
  defendant_type: person
  title: 李阿姨诉楼上半夜弹珠落地案
  grievance: 每天半夜十二点，楼上都会传来弹珠落地再滚动的声音，李阿姨已经数到了第三百颗。
  demand: 要求楼上交出所有弹珠。
  verdict: 一、楼上邻居当庭证明家中没有弹珠，依《法典》第八条但书，不构成扰民；二、弹珠来源列为本庭悬案；三、双方各买一块地毯，共同维护楼宇和平。
  outcome: split
  judge_quote: 本庭也很想知道，那颗弹珠到底是谁的喵。
  tags: 楼上 邻居 弹珠 噪音 半夜 扰民
- case_no: （2020）喵民初字第0016号
  plaintiff: 程序员小马
  defendant: 笔记本电脑
  defendant_type: digital
  title: 小马诉电脑在年终汇报时自动更新案
  grievance: 年终汇报投屏的瞬间，电脑弹出"正在更新，请勿关机，已完成 1%"，全公司一起看了二十分钟进度条。
  demand: 要求电脑赔偿年终奖。
  verdict: 一、依《法典》第二十条，电脑擅自更新，败诉；二、电脑须在下次开机时显示"对不起"三遍；三、年终奖由老板另行判断，本庭无权管辖。
  outcome: plaintiff
  judge_quote: 预计还需三分钟，是世界上最长的三分钟喵。
  tags: 电脑 自动更新 开会 汇报 演示 重启 进度条
- case_no: （2020）喵民初字第0019号
  plaintiff: 小美
  defendant: 体重秤
  defendant_type: appliance
  title: 小美诉体重秤春节后恶意诽谤案
  grievance: 春节回来，体重秤显示的数字比年前多了六斤，小美认为体重秤在造谣。
  demand: 要求体重秤更正数字。
  verdict: 一、依《法典》第二十三条，如实报告体重不构成诽谤，驳回更正请求；二、体重秤自即日起保持沉默三日；三、原告每天散步三十分钟，由体重秤监督。
  outcome: split
  judge_quote: 体重秤没有说谎，它只是不懂人情世故喵。
  tags: 体重秤 体重 春节 减肥 长胖 节假日
- case_no: （2020）喵民初字第0021号
  plaintiff: 阿杰
  defendant: 外卖
  defendant_type: person
  title: 阿杰诉外卖总在洗澡时送达案
  grievance: 阿杰每次点外卖，只要一进浴室打上洗发水，骑手的电话就会准时响起，至今未失手过。
  demand: 要求外卖改为在洗澡后送达。
  verdict: 一、依《法典》第十二条，外卖时机不当，部分成立；二、骑手到达后应等待两分钟；三、原告洗澡前应先确认外卖已到，不得心存侥幸。
  outcome: split
  judge_quote: 外卖和洗发水之间，似乎有某种神秘的量子纠缠喵。
  tags: 外卖 洗澡 骑手 送达 电话 时机
- case_no: （2021）喵民初字第0023号
  plaintiff: 小陈
  defendant: 薯片
  defendant_type: food
  title: 小陈诉薯片袋一半是空气案
  grievance: 小陈打开一袋鼓鼓的薯片，倒出来只有十一片，剩下全是空气。
  demand: 要求薯片补足差额。
  verdict: 一、依《法典》第十三条，空气部分视为赠品；二、但空气占比过高，薯片厂家下一袋应多放三片；三、原告吃完应把袋子叠成三角形，以示宽宏。
  outcome: split
  judge_quote: 你买的不是薯片，是一袋带着薯片味道的氮气喵。
  tags: 薯片 零食 空气 包装 分量
- case_no: （2021）喵民初字第0026号
  plaintiff: 老张
  defendant: 自己的膝盖
  defendant_type: body
  title: 老张诉膝盖下雨前疼痛泄露天机案
  grievance: 老张的膝盖每逢下雨前一天就开始隐隐作痛，比天气预报还准，老张觉得自己像个人形气象站。
  demand: 要求膝盖停止预报。
  verdict: 一、膝盖预报准确，造福家庭，不构成侵权；二、聘请膝盖为家庭气象顾问，每年发放护膝一副作为报酬；三、原告少爬楼梯。
  outcome: defendant
  judge_quote: 能比气象台还准，这是天赋，不是病，好吧也可能是病，去看医生喵。
  tags: 膝盖 下雨 疼痛 天气 预报 身体
- case_no: （2021）喵民初字第0027号
  plaintiff: 小雨
  defendant: 天气预报
  defendant_type: nature
  title: 小雨诉天气预报说不下雨结果下暴雨案
  grievance: 天气预报说今天降水概率百分之十，小雨没带伞，结果在路上被浇成了落汤鸡。
  demand: 要求天气预报赔一把伞。
  verdict: 一、百分之十不等于零，天气预报不构成欺诈；二、天气预报今后应多用"可能""大概""看心情"等词；三、原告包里常备折叠伞一把。
  outcome: split
  judge_quote: 百分之十的雨，淋在你身上，就是百分之百喵。
  tags: 天气预报 下雨 暴雨 带伞 淋湿 天气
- case_no: （2021）喵民初字第0030号
  plaintiff: 打工人小吴
  defendant: 周一
  defendant_type: time
  title: 小吴诉周一每周准时到来案
  grievance: 小吴认为周一每周都来，从不请假，给自己造成了严重的精神压力。
  demand: 要求取消周一。
  verdict: 一、依《法典》第二十四条，周一原则上不得被起诉，本庭只判周一深刻反省；二、原告周日晚上提前焦虑不得超过一小时。
  outcome: split
  judge_quote: 周一是无辜的，有罪的是周日晚上的你喵。
  tags: 周一 上班 星期一 焦虑 周末
- case_no: （2021）喵民初字第0032号
  plaintiff: 研究生小孙
  defendant: 论文截止日期
  defendant_type: time
  title: 小孙诉截止日期突然到来案
  grievance: 论文截止日期毫无预兆地到了，小孙才写了一个标题和一个致谢。
  demand: 要求截止日期往后推一个月。
  verdict: 一、经查原告一个月前曾公开表示"还早呢"，依《法典》第二十五条视为放弃抗辩，原告败诉；二、原告今晚开始写正文。
  outcome: defendant
  judge_quote: 截止日期从不突然，它只是一直在安静地走过来喵。
  tags: 截止日期 deadline 论文 拖延 作业 熬夜
- case_no: （2021）喵民初字第0034号
  plaintiff: 阿明
  defendant: 洗衣机
  defendant_type: appliance
  title: 阿明诉洗衣机吞袜子案
  grievance: 阿明每次洗衣服都放进去一双袜子，拿出来只剩一只，三年来已经攒了二十三只单身袜子。
  demand: 要求洗衣机交出所有袜子。
  verdict: 一、经本庭派员勘查，在洗衣机内筒夹缝中起获袜子七只，洗衣机败诉；二、洗衣机须为每只单身袜子找到对象；三、原告今后把袜子装进洗衣袋。
  outcome: plaintiff
  judge_quote: 每一只消失的袜子，都在某个夹缝里等你喵。
