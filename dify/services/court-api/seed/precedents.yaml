- case_no: （2022）喵民初字第0036号
  plaintiff: 小高
  defendant: 手机
  defendant_type: digital
  title: 小高诉手机电量百分之二十突然关机案
  grievance: 手机明明显示还有百分之二十的电，小高正准备扫码付款，手机直接黑屏关机。
  demand: 要求手机如实显示电量。
  verdict: 一、依《法典》第十九条，构成电量欺诈，手机败诉；二、手机今后电量显示改为"百分之二十（大概）"；三、原告随身携带充电宝。
  outcome: plaintiff
  judge_quote: 百分之二十的电，是手机给你的最后一个善意的谎言喵。
  tags: 手机 电量 关机 充电 付款 数码
- case_no: （2022）喵民初字第0038号
  plaintiff: 芳芳
  defendant: 输入法
  defendant_type: digital
  title: 芳芳诉输入法把"老板好"联想成"老板坏"案
  grievance: 芳芳在工作群里飞快地打了"老板好"，输入法联想成了"老板坏"，并且芳芳按了发送。
  demand: 要求输入法向老板解释。
  verdict: 一、依《法典》第二十一条，输入法承担连带责任，原告未检查承担主要责任；二、输入法须学会"老板最好"这一词组；三、原告发送前默数三秒。
  outcome: split
  judge_quote: 输入法只是说出了你的潜意识，本庭不予置评喵。
  tags: 输入法 打错字 联想 群聊 老板 尴尬
- case_no: （2022）喵民初字第0040号
  plaintiff: 小赵
  defendant: 自家的狗
  defendant_type: pet
  title: 小赵诉狗把拖鞋全部叼进狗窝案
  grievance: 小赵下班回家，发现家里所有拖鞋都整整齐齐地出现在狗窝里，狗正趴在上面一脸骄傲。
  demand: 要求狗归还拖鞋并承诺不再犯。
  verdict: 一、依《法典》第十六条，被告系"太高兴了"，免于处罚；二、狗须陪原告散步一次作为社区服务；三、拖鞋归还一半，另一半视为狗的收藏品。
  outcome: defendant
  judge_quote: 它不是在偷拖鞋，它是在收集你的味道喵。
  tags: 狗 拖鞋 拆家 宠物 狗窝
- case_no: （2022）喵民初字第0041号
  plaintiff: 陈奶奶
  defendant: 鹦鹉
  defendant_type: pet
  title: 陈奶奶诉鹦鹉在家庭聚会上大喊"不想上班"案
  grievance: 春节家庭聚会上，家里的鹦鹉突然对着全家人大喊"不想上班！不想上班！"，孙子当场脸红。
  demand: 要求鹦鹉停止乱说话。
  verdict: 一、鹦鹉只是复读，无罪；二、经查该语句来源于孙子每天早上的自言自语，由孙子承担全部责任；三、孙子须教鹦鹉说一句吉祥话。
  outcome: defendant
  judge_quote: 鹦鹉不会说谎，它只是一台诚实的录音机喵。
