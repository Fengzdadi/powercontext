- case_no: （2023）喵民初字第0050号
  plaintiff: 大伟
  defendant: 老板
  defendant_type: person
  title: 大伟诉老板周五下午五点派活案
  grievance: 每到周五下午五点，老板就会走过来说"这个不急，你周一前给我就行"。
  demand: 要求老板周五下午不得派活。
  verdict: 一、老板周五下午只能派"真的周一再做"的活；二、原告周五四点后不得假装很忙以躲避；三、双方共同遵守"周末神圣"原则。
  outcome: split
  judge_quote: 「这个不急」是老板世界里最急的四个字喵。
  tags: 老板 加班 周五 派活 上班 周末
- case_no: （2023）喵民初字第0052号
  plaintiff: 小雪
  defendant: 自家的猫
  defendant_type: pet
  title: 小雪诉猫把水杯推下桌案
  grievance: 猫当着小雪的面，盯着她的眼睛，用爪子把桌上的水杯一点一点推下了桌子。
  demand: 要求猫赔一个杯子。
  verdict: 一、依《法典》第十五条，猫推落物品不构成侵权；二、原告今后使用带盖水杯，并放在桌子中央；三、猫须呼噜十秒以示安抚。
  outcome: defendant
  judge_quote: 它不是在推杯子，它是在做重力实验，科学无罪喵。
