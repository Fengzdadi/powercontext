- case_no: （2022）喵民初字第0045号
  plaintiff: 阿宝
  defendant: 同事
  defendant_type: person
  title: 阿宝诉同事在公司微波炉里热鱼案
  grievance: 同事每天中午在公司微波炉里热咸鱼，整层楼弥漫着海洋的气息，阿宝的工位就在微波炉旁边。
  demand: 要求同事改热别的。
  verdict: 一、同事行为构成气味扰邻，败诉；二、同事请全组喝奶茶一次；三、同事今后改热馒头，咸鱼带回家吃。
  outcome: plaintiff
  judge_quote: 本庭作为一只猫，必须声明，本庭其实挺喜欢那个味道的喵。
