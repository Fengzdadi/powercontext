- case_no: （2022）喵民初字第0043号
  plaintiff: 小丁
  defendant: 蚊子
  defendant_type: nature
  title: 小丁诉蚊子深夜耳边嗡嗡案
  grievance: 一只蚊子每晚在小丁耳边盘旋，开灯就消失，关灯就出现，已持续一周。
  demand: 要求蚊子立即离开卧室。
  verdict: 一、依《法典》第十七条，蚊子推定为恶意，其"只是路过"的抗辩不予采纳；二、蚊子缺席审判，判处驱逐出卧室；三、原告安装纱窗。
  outcome: plaintiff
  judge_quote: 开灯就消失，关灯就出现，这是蚊子界的顶级刺客喵。
