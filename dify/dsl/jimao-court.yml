app:
  description: 一只记仇的橘猫法官审理你生活里的鸡毛蒜皮。判例集存在 seekdb（混合检索、越判越多），原告的案底和法官印象存在 PowerContext（跨会话记忆）。
  icon: 🐱
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: advanced-chat
  name: 喵青天·鸡毛蒜皮法庭
  use_icon_as_answer_icon: true
dependencies:
- current_identifier: null
  type: marketplace
