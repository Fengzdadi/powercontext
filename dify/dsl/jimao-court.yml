    nodes:
    - data:
        desc: ''
        selected: false
        title: 开始：原告报到
        type: start
        variables:
        - default: ''
          hint: ''
          label: 原告大名（同一个名字 = 同一份案底）
          max_length: 20
          options: []
          placeholder: 例如：阿强
          required: true
          type: text-input
          variable: player
      height: 100
      id: start
      position:
        x: 0
        y: 300
      positionAbsolute:
        x: 0
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "import re\nimport unicodedata\n\n\ndef main(query: str, stage: str,\
          \ player: str) -> dict:\n    text = unicodedata.normalize(\"NFC\", query\
          \ or \"\").strip()\n    name = re.sub(r\"\\s+\", \"\", unicodedata.normalize(\"\
          NFC\", player or \"\"))[:20] or \"无名氏\"\n    compact = re.sub(r\"[\\s，。！？!?,.、~～]+\"\
          , \"\", text)\n    route, search_query = \"\", \"\"\n    m = re.match(r\"\
          ^(查判例|判例检索|检索判例|搜判例|查案例)[：:\\s]*(.*)$\", text, re.S)\n    if compact in\
          \ (\"帮助\", \"help\", \"怎么玩\", \"玩法\", \"说明\", \"菜单\", \"你好\", \"您好\", \"\
          hi\", \"hello\", \"在吗\", \"喵\"):\n        route = \"help\"\n    elif compact\
          \ in (\"本院公告\", \"公告\", \"统计\", \"排行榜\", \"本院统计\", \"法院公告\"):\n        route\
          \ = \"stats\"\n    elif m:\n        route, search_query = \"search\", m.group(2).strip()[:100]\
          \ or \"鸡毛蒜皮\"\n    elif compact in (\"查案底\", \"我的案底\", \"案底\", \"查档案\",\
          \ \"我的档案\", \"小本本\"):\n        route = \"record\"\n    elif stage == \"\
          awaiting\" and compact in (\"撤诉\", \"我撤诉\", \"不告了\", \"算了\"):\n        route\
          \ = \"withdraw\"\n    elif stage == \"awaiting\":\n        route = \"verdict\"\
          \n    else:\n        route = \"file\"\n    return {\n        \"route\":\
          \ route,\n        \"player\": name,\n        \"text\": text[:600] or \"\
          （原告沉默不语）\",\n        \"search_query\": search_query,\n        \"scope_body\"\
          : __import__(\"json\").dumps({\n            \"title\": f\"鸡毛蒜皮法庭·原告 {name}\"\
          ,\n            \"summary\": f\"喵青天法庭为原告「{name}」建立的案底档案\",\n            \"\
          idempotency_key\": f\"jimao-court:player:{name}\",\n        }, ensure_ascii=False),\n\
          \    }\n"
        code_language: python3
        desc: 识别指令与庭审阶段：帮助 / 公告 / 查判例 / 查案底 / 撤诉 / 宣判 / 立案
        outputs:
          player:
            children: null
            type: string
          route:
            children: null
            type: string
          scope_body:
            children: null
            type: string
          search_query:
            children: null
            type: string
          text:
            children: null
            type: string
        selected: false
        title: 指令分流
        type: code
        variables:
        - value_selector:
          - sys
          - query
          variable: query
        - value_selector:
          - conversation
          - stage
          variable: stage
        - value_selector:
          - start
          - player
          variable: player
      height: 100
      id: route
      position:
        x: 320
        y: 300
      positionAbsolute:
        x: 320
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data:
          - id: 7d9b2175-2065-4393-b97b-2eef5a251e4b
            key: ''
            type: text
            value: '{{#route.scope_body#}}'
          type: json
        default_value:
        - key: body
          type: string
          value: '{}'
        - key: status_code
          type: number
          value: 599
        - key: headers
          type: object
          value: {}
        desc: 按原告名幂等创建（或取回）专属 Scope，记忆按人隔离、跨会话复用
        error_strategy: default-value
        headers: Content-Type:application/json
        method: post
        params: ''
        retry_config:
          max_retries: 2
          retry_enabled: true
          retry_interval: 800
        selected: false
        ssl_verify: true
        timeout:
          connect: 5
          max_connect_timeout: 0
          max_read_timeout: 0
          max_write_timeout: 0
          read: 30
          write: 10
        title: PowerContext：打开原告档案
        type: http-request
        url: '{{#env.POWERCONTEXT_API#}}/v1/scopes'
      height: 100
      id: pc_scope
      position:
        x: 640
        y: 300
      positionAbsolute:
        x: 640
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "import json\n\n\ndef main(body: str, status_code: int) -> dict:\n \
          \   try:\n        scope_id = json.loads(body).get(\"scope_id\") or \"\"\n\
          \    except Exception:\n        scope_id = \"\"\n    return {\"scope_id\"\
          : scope_id, \"memory_ok\": \"yes\" if (status_code in (200, 201) and scope_id)\
          \ else \"no\"}\n"
        code_language: python3
        desc: ''
        outputs:
          memory_ok:
            children: null
            type: string
          scope_id:
            children: null
            type: string
        selected: false
        title: 取档案号
        type: code
        variables:
        - value_selector:
          - pc_scope
          - body
          variable: body
        - value_selector:
          - pc_scope
          - status_code
          variable: status_code
      height: 100
      id: scope
      position:
        x: 960
        y: 300
      positionAbsolute:
        x: 960
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        cases:
        - case_id: help
