          \ -> dict:\n    try:\n        data = json.loads(body) if status_code ==\
          \ 200 else None\n    except Exception:\n        data = None\n    if data\
          \ is None:\n        return {\"text\": \"\U0001F43E 档案室（PowerContext）暂时联系不上，喵青天的小本本找不到了。\"\
          }\n    items = [i.get(\"text\", \"\") for i in data.get(\"items\", []) if\
          \ i.get(\"state\", \"active\") == \"active\"]\n    if not items:\n     \
          \   return {\"text\": f\"\U0001F43E **喵青天的小本本 · 原告「{player}」**\\n\\n本庭还没见过你，档案干净得像刚舔过的猫碗。去起诉点什么吧！\"\
          }\n    order = {\"【案底】\": 0, \"【法官印象】\": 1}\n    items.sort(key=lambda t:\
          \ min([v for k, v in order.items() if t.startswith(k)] or [2]))\n    lines\
          \ = [f\"\U0001F43E **喵青天的小本本 · 原告「{player}」**（PowerContext 记忆，共 {len(items)}\
          \ 条）\", \"\"]\n    lines.extend(f\"- {t}\" for t in items)\n    lines.append(\"\
          \")\n    lines.append(\"这些记录跨会话保存：换个对话、隔几天再来，喵青天都记得。\")\n    return {\"\
          text\": \"\\n\".join(lines)}\n"
