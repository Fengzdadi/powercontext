    opening_statement: '🐱 啪！（惊堂木）{{player}}，本庭——喵青天·鸡毛蒜皮法庭——开门营业。

      说吧，你要起诉谁？闹钟、室友、WiFi、体重秤、周一……没有本庭不敢审的鸡毛蒜皮。'
