          \ {}\n    if archived.get(\"archived_text\"):\n        lines.append(archived[\"\
          archived_text\"])\n    else:\n        lines.append(\"\U0001F4DA 判例库（seekdb）暂时联系不上，本案判决未能编入判例集。\"\
          )\n    saved = [m for m, s in ((case_memory, case_status), (impression_memory,\
          \ impression_status)) if s == 200]\n    if saved:\n        lines.append(f\"\
          \U0001F43E 喵青天在小本本上记下了 {len(saved)} 条（PowerContext 记忆）：\")\n        lines.extend(f\"\
          > {m}\" for m in saved)\n    else:\n        lines.append(\"\U0001F43E 档案室（PowerContext）暂时联系不上，本庭这次没能记住你。\"\
          )\n    lines.append(\"\")\n    lines.append(\"想再告点什么，直接说就行；也可以输入「查案底」「查判例\
          \ 关键词」「本院公告」。\")\n    return {\"footer\": \"\\n\".join(lines)}\n"
