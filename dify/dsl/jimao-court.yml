    - data:
        code: "import json\nimport re\n\nTYPES = {\"pet\", \"appliance\", \"digital\"\
          , \"person\", \"food\", \"body\", \"nature\", \"time\", \"other\"}\n\n\n\
          def _json(text: str) -> dict:\n    text = re.sub(r\"<think>.*?</think>\"\
          , \"\", text or \"\", flags=re.S)\n    m = re.search(r\"\\{.*\\}\", text,\
          \ re.S)\n    if not m:\n        return {}\n    try:\n        data = json.loads(m.group(0))\n\
          \        return data if isinstance(data, dict) else {}\n    except Exception:\n\
          \        return {}\n\n\ndef main(llm_text: str, text: str, player: str,\
          \ scope_id: str, conversation_id: str) -> dict:\n    data = _json(llm_text)\n\
          \    defendant = str(data.get(\"defendant\") or \"\").strip()[:20]\n   \
          \ if not defendant:\n        m = re.search(r\"(?:起诉|告|状告)(?:我的|我家的?|我们家的?)?([^，。,.!！？?\\\
          s]{1,10})\", text)\n        defendant = m.group(1) if m else \"不明物体\"\n\
          \    dtype = str(data.get(\"defendant_type\") or \"other\").strip().lower()\n\
          \    dtype = dtype if dtype in TYPES else \"other\"\n    grievance = str(data.get(\"\
          grievance\") or text).strip()[:200]\n    demand = str(data.get(\"demand\"\
          ) or \"要求被告给个说法\").strip()[:80]\n    keywords = str(data.get(\"keywords\"\
          ) or \"\").strip()[:80]\n    search_query = f\"{defendant} {keywords} {grievance}\"\
          [:300]\n    return {\n        \"defendant\": defendant,\n        \"defendant_type\"\
          : dtype,\n        \"grievance\": grievance,\n        \"demand\": demand,\n\
          \        \"file_body\": json.dumps({\"player\": player, \"defendant\": defendant,\
          \ \"defendant_type\": dtype,\n                                 \"grievance\"\
          : grievance, \"demand\": demand,\n                                 \"conversation_id\"\
          : conversation_id or \"\"}, ensure_ascii=False),\n        \"search_body\"\
          : json.dumps({\"query\": search_query, \"defendant_type\": dtype,\n    \
          \                               \"precedent_k\": 3, \"statute_k\": 2}, ensure_ascii=False),\n\
          \        # PowerContext admits a full-text hit only when it shares enough\
          \ query terms. Every memory this\n        # app writes contains \"喵青天\"\
          \ and the player's name, so this short query recalls the whole record\n\
          \        # while memories about the same defendant rank first.\n       \
          \ \"recall_body\": json.dumps({\"scope_id\": scope_id, \"query\": f\"喵青天\
          \ {player} {defendant}\",\n                                   \"max_bytes\"\
          : 2000}, ensure_ascii=False),\n    }\n"
