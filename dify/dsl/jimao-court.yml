          text: '请从原告的起诉中提取立案信息，输出 JSON，字段如下：

            - "defendant"：被告，简短名词，如"闹钟""室友""WiFi""体重秤""周一"；实在说不清就写"不明物体"

            - "defendant_type"：只能是 pet（宠物动物）、appliance（家电物件）、digital（数码网络）、person（人）、food（食物）、body（身体）、nature（天气自然）、time（时间与抽象概念）、other（其他）之一

