    - data:
        code: "import json\n\nLABELS = {\"pet\": \"宠物动物\", \"appliance\": \"家电物件\"\
          , \"digital\": \"数码网络\", \"person\": \"人\", \"food\": \"食物\",\n        \
          \  \"body\": \"身体\", \"nature\": \"天气自然\", \"time\": \"时间与抽象\", \"other\"\
          : \"其他\"}\n\n\ndef _load(body: str, status: int) -> dict:\n    if status\
          \ not in (200, 201):\n        return {}\n    try:\n        data = json.loads(body)\n\
          \        return data if isinstance(data, dict) else {}\n    except Exception:\n\
          \        return {}\n\n\ndef _memories(prepared: dict) -> list:\n    content\
          \ = prepared.get(\"content\") or \"\"\n    start = content.find(\"BEGIN_POWERCONTEXT_PREPARED_CONTEXT_V1\"\
          )\n    end = content.find(\"END_POWERCONTEXT_PREPARED_CONTEXT_V1\")\n  \
          \  if start < 0 or end < 0:\n        return []\n    try:\n        payload\
          \ = json.loads(content[start + len(\"BEGIN_POWERCONTEXT_PREPARED_CONTEXT_V1\"\
          ):end].strip())\n    except Exception:\n        return []\n    return [str(i.get(\"\
          content\", \"\")).strip() for i in payload.get(\"items\", []) if i.get(\"\
          content\")]\n\n\ndef main(file_body: str, file_status: int, search_body:\
          \ str, search_status: int, recall_body: str,\n         recall_status: int,\
          \ player: str, defendant: str, defendant_type: str, grievance: str, demand:\
          \ str,\n         memory_ok: str) -> dict:\n    filed = _load(file_body,\
          \ file_status)\n    found = _load(search_body, search_status)\n    prepared\
          \ = _load(recall_body, recall_status)\n    case_no = filed.get(\"case_no\"\
          ) or \"（书记员忘了编号）\"\n    memories = _memories(prepared)\n    if memories:\n\
          \        memory_text = \"\\n\".join(f\"- {m}\" for m in memories)\n    elif\
          \ memory_ok == \"yes\" and recall_status in (200, 201):\n        memory_text\
          \ = \"（本庭第一次见到这位原告，没有任何档案。）\"\n    else:\n        memory_text = \"（PowerContext\
          \ 档案室暂时联系不上，本庭今天只能凭印象审案。）\"\n    precedents_text = found.get(\"precedents_text\"\
          ) or \"（seekdb 判例库暂时联系不上，本庭只能凭良心判。）\"\n    statutes_text = found.get(\"\
          statutes_text\") or \"（法典暂时找不到了。）\"\n    if memories:\n        open_hint\
          \ = (\"敲惊堂木，宣读案号和案由；然后用一两句话点出历史档案里记着的具体往事（旧案、判决执行情况、\"\n               \
          \      \"行贿或捣乱前科、你对他的印象），挑最好笑的说，只说档案里写着的事\")\n    else:\n        open_hint\
          \ = (\"敲惊堂木，宣读案号和案由；这位原告是第一次来本庭，热情欢迎这位新面孔，调侃一下他的案由。\"\n                \
          \     \"他在本庭没有任何过去，不要提“上次”“又来了”之类的话\")\n    ask_hint = \"就本案向原告提一个刁钻又好笑的问题，或要求原告出示一份离谱的证据，等原告下一轮回答\"\
          \n    if any(\"原告须\" in m for m in memories):\n        ask_hint += \"；可以顺带追问档案里记着的、他上次被判要做的事执行得怎么样\"\
          \n    label = LABELS.get(defendant_type, \"其他\")\n    brief = (f\"案号：{case_no}\\\
          n原告：{player}\\n被告：{defendant}（{label}）\\n\"\n             f\"案情：{grievance}\\\
          n诉求：{demand}\")\n    if filed:\n        docket = f\"\U0001F4DC **立案登记**：{case_no}《{filed.get('title',\
          \ player + '诉' + defendant + '案')}》\"\n    else:\n        docket = \"\U0001F4DC\
          \ **立案登记**：书记员（court-api）没来上班，本案暂不编号。\"\n    recall_note = (f\"\U0001F43E\
          \ 档案室（PowerContext）调出了你的 {len(memories)} 条记录\" if memories\n           \
          \        else \"\U0001F43E 档案室（PowerContext）里还没有你的记录\")\n    hits = found.get(\"\
          precedents\") or []\n    search_note = (f\"\U0001F4DA 判例库（seekdb 混合检索）找到\
          \ {len(hits)} 件相似判例：\" + \"、\".join(p.get(\"case_no\", \"\") for p in hits)\n\
          \                   if hits else \"\U0001F4DA 判例库（seekdb）没有找到相似判例\")\n \
          \   return {\n        \"case_no\": case_no,\n        \"defendant\": defendant,\n\
          \        \"defendant_type_label\": label,\n        \"grievance\": grievance,\n\
          \        \"demand\": demand,\n        \"case_brief\": brief,\n        \"\
          memory_text\": memory_text,\n        \"precedents_text\": precedents_text,\n\
          \        \"statutes_text\": statutes_text,\n        \"citations\": precedents_text\
          \ + \"\\n\" + statutes_text,\n        \"docket_text\": docket + \"\\n> \"\
          \ + search_note + \"\\n> \" + recall_note,\n        \"open_hint\": open_hint,\n\
          \        \"ask_hint\": ask_hint,\n    }\n"
