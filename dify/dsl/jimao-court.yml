    - data:
        code: "import json\nimport re\nfrom datetime import datetime\n\nOUTCOMES =\
          \ {\"plaintiff\": \"原告胜诉\", \"defendant\": \"被告胜诉\", \"split\": \"各打五十大板\"\
          }\n\n\ndef _json(text: str) -> dict:\n    text = re.sub(r\"<think>.*?</think>\"\
          , \"\", text or \"\", flags=re.S)\n    m = re.search(r\"\\{.*\\}\", text,\
          \ re.S)\n    if not m:\n        return {}\n    try:\n        data = json.loads(m.group(0))\n\
          \        return data if isinstance(data, dict) else {}\n    except Exception:\n\
          \        return {}\n\n\ndef _field(brief: str, name: str) -> str:\n    m\
          \ = re.search(name + r\"：(.*)\", brief or \"\")\n    return m.group(1).strip()\
          \ if m else \"\"\n\n\ndef main(archive_text: str, verdict_text: str, case_no:\
          \ str, case_brief: str, player: str, scope_id: str) -> dict:\n    data =\
          \ _json(archive_text)\n    defendant = re.sub(r\"（.*?）$\", \"\", _field(case_brief,\
          \ \"被告\")) or \"被告\"\n    outcome = str(data.get(\"outcome\") or \"split\"\
          ).strip().lower()\n    outcome = outcome if outcome in OUTCOMES else \"\
          split\"\n    cause = re.sub(r\"[《》\\s]\", \"\", str(data.get(\"cause\")\
          \ or \"\")).removesuffix(\"案\")[:10]\n    title = f\"{player}诉{defendant}{cause}案\"\
          \n    verdict = str(data.get(\"verdict\") or \"\").strip()[:300]\n    if\
          \ not verdict:\n        m = re.search(r\"判决如下[^\\n]*\\n(.*?)(?:\\n#+|\\\
          Z)\", verdict_text or \"\", re.S)\n        verdict = re.sub(r\"\\s+\", \"\
          \ \", m.group(1)).strip()[:300] if m else \"本庭已当庭宣判。\"\n    quote = str(data.get(\"\
          judge_quote\") or \"\").strip()[:120]\n    if not quote:\n        m = re.search(r\"\
          金句[^\\n]*\\n+\\s*[>「“\\\"]?(.+)\", verdict_text or \"\")\n        quote\
          \ = m.group(1).strip(\" 」”\\\"\")[:120] if m else \"\"\n    tags = str(data.get(\"\
          tags\") or defendant).strip()[:100]\n    duty = str(data.get(\"plaintiff_duty\"\
          ) or \"\").strip().rstrip(\"。.；;\")[:80]\n    impression = str(data.get(\"\
          impression\") or \"一位有故事的原告\").strip().rstrip(\"。.！!\")[:60]\n    misconduct\
          \ = str(data.get(\"misconduct\") or \"\").strip().rstrip(\"。.\")[:80]\n\
          \    if misconduct in (\"无\", \"没有\", \"none\", \"None\", \"null\", \"空\"\
          ):\n        misconduct = \"\"\n    today = datetime.now().strftime(\"%Y-%m-%d\"\
          )\n    case_memory = f\"【案底】{today} 喵青天审理《{title}》，案号{case_no}。判决：{verdict}（{OUTCOMES[outcome]}）\"\
          \n    if duty:\n        case_memory += f\" 原告须：{duty}——下次到庭时须向本庭汇报执行情况。\"\
          \n    impression_memory = f\"【法官印象】喵青天对{player}的印象：{impression}。\"\n   \
          \ if misconduct:\n        impression_memory += f\" 【藐视法庭】{player}在{title}中{misconduct}\"\
          \ + (\n            \"。\" if any(w in misconduct for w in (\"案底\", \"档案\"\
          , \"记入\")) else \"，已记入案底。\")\n    return {\n        \"verdict_body\": json.dumps({\"\
          case_no\": case_no, \"title\": title, \"verdict\": verdict, \"outcome\"\
          : outcome,\n                                    \"judge_quote\": quote,\
          \ \"tags\": tags}, ensure_ascii=False),\n        \"remember_case_body\"\
          : json.dumps({\"scope_id\": scope_id, \"kind\": \"fact\", \"text\": case_memory,\n\
          \                                          \"reason\": \"鸡毛蒜皮法庭判决归档\"},\
          \ ensure_ascii=False),\n        \"remember_impression_body\": json.dumps({\"\
          scope_id\": scope_id, \"kind\": \"preference\",\n                      \
          \                          \"text\": impression_memory,\n              \
          \                                  \"reason\": \"喵青天对原告的印象\"}, ensure_ascii=False),\n\
          \        \"case_memory\": case_memory,\n        \"impression_memory\": impression_memory,\n\
          \        \"outcome_label\": OUTCOMES[outcome],\n    }\n"
